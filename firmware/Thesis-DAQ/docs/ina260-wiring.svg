<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker>
    <style>
      text {font-family:Arial,sans-serif;fill:#172033;font-size:15px}
      .title {font-size:22px;font-weight:bold}
      .heading {font-size:17px;font-weight:bold}
      .note {font-size:13px;fill:#475569}
      .wire {fill:none;stroke-width:2.5;stroke-linejoin:miter;marker-end:url(#arrow)}
      .battery {stroke:#be123c}
      .usb {stroke:#2563eb}
      .signal {stroke:#059669}
      .ground {stroke:#64748b}
    </style>
