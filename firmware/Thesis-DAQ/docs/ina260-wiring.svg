  <text x="825" y="495" class="note">PWM</text>
  <rect x="600" y="735" width="200" height="260" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="762" class="heading">NAU7802</text>
  <text x="612" y="801">VIN (3.3 V)</text>
  <text x="612" y="841">SDA</text>
  <text x="612" y="881">SCL</text>
  <text x="612" y="961">GND</text>
  <text x="620" y="985" class="note">B+ / B&#8722; unused</text>
  <text x="750" y="801">E+</text>
  <text x="750" y="841">E&#8722;</text>
  <text x="750" y="881">A+</text>
  <text x="750" y="921">A&#8722;</text>
  <text x="710" y="961">Shield/GND</text>

  <rect x="880" y="735" width="180" height="260" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="900" y="762" class="heading">S-type load cell</text>
  <text x="892" y="801">Red / excitation +</text>
  <text x="892" y="841">Black / excitation &#8722;</text>
  <text x="892" y="881">Green / signal +</text>
  <text x="892" y="921">White / signal &#8722;</text>
  <text x="892" y="961">Yellow / shield</text>

  <path class="wire usb" d="M565 363 V407 Q575 413 565 419 V457 Q575 463 565 469 V507 Q575 513 565 519 V557 Q575 563 565 569 V609 Q575 615 565 621 V629 Q575 635 565 641 V795 H600"/>
  <path class="wire signal" d="M540 413 V457 Q550 463 540 469 V507 Q550 513 540 519 V557 Q550 563 540 569 V609 Q550 615 540 621 V629 Q550 635 540 641 V835 H600"/>
  <path class="wire signal" d="M515 463 V507 Q525 513 515 519 V557 Q525 563 515 569 V609 Q525 615 515 621 V629 Q525 635 515 641 V875 H600"/>
  <path class="wire ground" d="M490 563 V609 Q500 615 490 621 V629 Q500 635 490 641 V955 H600"/>
  <circle cx="565" cy="363" r="4" fill="#2563eb"/>
  <circle cx="540" cy="413" r="4" fill="#059669"/>
  <circle cx="515" cy="463" r="4" fill="#059669"/>
  <circle cx="490" cy="563" r="4" fill="#64748b"/>

  <path class="wire" stroke="#be123c" d="M880 795 H800"/>
  <path class="wire" stroke="#172033" d="M880 835 H800"/>
