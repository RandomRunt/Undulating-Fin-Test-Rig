  <text x="80" y="141" class="heading">LiPo battery</text>
  <text x="145" y="174">+ positive</text><text x="145" y="209">&#8722; negative</text>

  <rect x="600" y="115" width="200" height="490" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
